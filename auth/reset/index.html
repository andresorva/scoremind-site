<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <meta name="description" content="Reset your ScoreMind AI password securely.">
  <meta name="robots" content="noindex, nofollow">
  <meta name="referrer" content="no-referrer">
  <link rel="icon" type="image/png" href="/logo.png">
  <style>
    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
    html { scroll-behavior: smooth; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
      background: #0a0e1a;
      color: #f1f5f9;
      line-height: 1.6;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }
    a { color: #00e5cc; text-decoration: none; transition: opacity 0.2s; }
    a:hover { opacity: 0.8; }

    /* Nav */
    .nav {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 16px 24px;
      max-width: 1100px;
      margin: 0 auto;
      width: 100%;
    }
    .nav-logo { display: flex; align-items: center; gap: 10px; text-decoration: none; }
    .nav-logo img { width: 36px; height: 36px; border-radius: 20%; }
    .nav-logo span { font-size: 20px; font-weight: 800; color: #fff; letter-spacing: -0.5px; }
    .nav-logo .ai { color: #00e5cc; }
    .lang-toggle {
      display: flex;
      background: #1a2236;
      border-radius: 8px;
      overflow: hidden;
      border: 1px solid rgba(255,255,255,0.08);
    }
    .lang-btn {
      padding: 6px 12px;
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
      border: none;
      background: transparent;
      color: #64748b;
      transition: all 0.2s;
      font-family: inherit;
    }
    .lang-btn.active { background: #00e5cc; color: #0a0e1a; }

    /* Main */
    .hero {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 32px 20px 40px;
      width: 100%;
    }
    .card {
      width: 100%;
      max-width: 400px;
      background: #131a2b;
      border: 1px solid rgba(255,255,255,0.08);
      border-radius: 16px;
      padding: 32px 24px;
      box-shadow: 0 10px 40px rgba(0,0,0,0.4);
    }
    .title {
      font-size: 24px;
      font-weight: 800;
      letter-spacing: -0.4px;
      margin-bottom: 8px;
      color: #f1f5f9;
    }
    .subtitle {
      font-size: 14px;
      color: #94a3b8;
      margin-bottom: 24px;
    }
    .field { margin-bottom: 16px; }
    .label {
      display: block;
      font-size: 13px;
      font-weight: 600;
      color: #cbd5e1;
      margin-bottom: 6px;
    }
    .input {
      width: 100%;
      padding: 12px 14px;
      font-size: 15px;
      background: #0a0e1a;
      color: #f1f5f9;
      border: 1.5px solid rgba(255,255,255,0.1);
      border-radius: 10px;
      font-family: inherit;
      transition: border-color 0.15s;
    }
    .input:focus {
      outline: none;
      border-color: #00e5cc;
    }
    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 100%;
      padding: 13px 20px;
      font-size: 15px;
      font-weight: 700;
      letter-spacing: -0.2px;
      border-radius: 10px;
      border: 1.5px solid transparent;
      cursor: pointer;
      transition: transform 0.15s ease, opacity 0.15s ease;
      text-decoration: none;
      font-family: inherit;
    }
    .btn-primary { background: #00e5cc; color: #0a0e1a; }
    .btn-primary:hover:not(:disabled) { opacity: 0.92; transform: translateY(-1px); }
    .btn-primary:disabled { opacity: 0.5; cursor: not-allowed; }
    .msg {
      font-size: 13px;
      padding: 10px 12px;
      border-radius: 8px;
      margin-bottom: 14px;
      display: none;
    }
    .msg.error {
      background: rgba(239,68,68,0.12);
      border: 1px solid rgba(239,68,68,0.3);
      color: #fca5a5;
      display: block;
    }
    .msg.info {
      background: rgba(0,229,204,0.10);
      border: 1px solid rgba(0,229,204,0.25);
      color: #99f0e2;
      display: block;
    }

    /* Success */
    .success-state {
      text-align: center;
      display: none;
    }
    .success-state.show { display: block; }
    .form-state.hide { display: none; }
    .check-wrap {
      width: 64px;
      height: 64px;
      margin: 0 auto 20px;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 50%;
      background: rgba(34,197,94,0.12);
      border: 1px solid rgba(34,197,94,0.3);
    }
    .check-wrap svg { width: 36px; height: 36px; }

    /* Footer */
    .footer {
      border-top: 1px solid rgba(255,255,255,0.06);
      padding: 20px 24px;
      text-align: center;
      max-width: 1100px;
      margin: 0 auto;
      width: 100%;
    }
    .footer-links {
      display: flex;
      justify-content: center;
      gap: 20px;
      margin-bottom: 10px;
      flex-wrap: wrap;
    }
    .footer-links a { font-size: 12px; color: #94a3b8; }
    .footer-links a:hover { color: #00e5cc; }
    .footer-copy { font-size: 11px; color: #64748b; }

    /* RTL */
    html[dir="rtl"] .nav-logo { flex-direction: row-reverse; }
    html[dir="rtl"] .label { text-align: right; }

    /* Light theme */
    @media (prefers-color-scheme: light) {
      body { background: #f8fafc; color: #0f172a; }
      .nav-logo span { color: #0f172a; }
      .lang-toggle { background: #ffffff; border-color: rgba(0,0,0,0.08); }
      .lang-btn { color: #64748b; }
      .card { background: #ffffff; border-color: rgba(0,0,0,0.06); box-shadow: 0 10px 30px rgba(15,23,42,0.06); }
      .title { color: #0f172a; }
      .subtitle { color: #475569; }
      .label { color: #334155; }
      .input { background: #f1f5f9; color: #0f172a; border-color: rgba(0,0,0,0.1); }
      .footer-copy { color: #94a3b8; }
      .footer-links a { color: #475569; }
    }

    @media (max-width: 420px) {
      .nav { padding: 12px 16px; }
      .card { padding: 24px 18px; }
      .title { font-size: 20px; }
    }
  </style>
</head>
<body>
  <!-- Nav -->
  <nav class="nav">
    <a href="/" class="nav-logo">
      <img src="/logo.png" alt="ScoreMind.AI">
      <span>ScoreMind<span class="ai">.AI</span></span>
    </a>
    <div class="lang-toggle" id="lang-toggle">
      <button type="button" class="lang-btn" data-lang="en">EN</button>
      <button type="button" class="lang-btn" data-lang="es">ES</button>
      <button type="button" class="lang-btn" data-lang="pt">PT</button>
      <button type="button" class="lang-btn" data-lang="fr">FR</button>
      <button type="button" class="lang-btn" data-lang="ar">AR</button>
    </div>
  </nav>

  <!-- Main -->
  <section class="hero">
    <div class="card">
      <!-- Form state -->
      <div class="form-state" id="form-state">
        <h1 class="title" id="title">Set a new password</h1>
        <p class="subtitle" id="subtitle">Choose a strong password (at least 8 characters).</p>

        <div class="msg" id="msg" role="alert"></div>

        <form id="reset-form" autocomplete="off" novalidate>
          <div class="field">
            <label class="label" for="pwd1" id="label-pwd">New password</label>
            <input class="input" type="password" id="pwd1" name="pwd1" minlength="8" required autocomplete="new-password">
          </div>
          <div class="field">
            <label class="label" for="pwd2" id="label-pwd2">Confirm password</label>
            <input class="input" type="password" id="pwd2" name="pwd2" minlength="8" required autocomplete="new-password">
          </div>
          <button type="submit" class="btn btn-primary" id="submit-btn" disabled>Update password</button>
        </form>
      </div>

      <!-- Success state -->
      <div class="success-state" id="success-state">
        <div class="check-wrap" aria-hidden="true">
          <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
            <path d="M4 12.5L9.5 18L20 7" stroke="#22c55e" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
        </div>
        <h1 class="title" id="success-title">All set</h1>
        <p class="subtitle" id="success-msg">Password updated. Open the app to log in.</p>
        <a href="ai.scoremind.app://login-callback" class="btn btn-primary" id="open-app-btn" style="margin-top:8px;">Open ScoreMindAI</a>
      </div>
    </div>
  </section>

  <!-- Footer -->
  <footer class="footer">
    <div class="footer-links">
      <a href="/privacy" id="link-privacy">Privacy Policy</a>
      <a href="/terms" id="link-terms">Terms of Service</a>
      <a href="mailto:info@datanaat.com" id="link-contact">Contact</a>
    </div>
    <div class="footer-copy">&copy; 2026 Datanaat. All rights reserved. <span style="display:inline-block;padding:2px 10px;border-radius:999px;border:1px solid currentColor;font-size:11px;font-weight:700;letter-spacing:0.5px;margin-left:8px;vertical-align:middle;opacity:0.85;">18+</span></div>
  </footer>

  <script>

  (function () {
    var clean = new URL(window.location.href);
    clean.hash = '';
    ['code', 'access_token', 'refresh_token', 'error', 'error_description', 'error_code'].forEach(function (key) { clean.searchParams.delete(key); });
    try { history.replaceState(null, '', clean.pathname + clean.search); } catch (_) { /* no persistence fallback */ }
  })();
  </script>

      },
      ar: {

        errIncompatibleLink: 'يتطلب هذا الرابط الجهاز الذي طلبه. اطلب رابطًا جديدًا من تطبيق iOS المحدّث لإعادة تعيين كلمة المرور في هذا المتصفح.',

        successTitle: 'تم',

    var busy = false;
    var checking = true;
    var errorKey = null;

    // Language detection: ?lang= → navigator.language → 'en'
    var params = new URLSearchParams(window.location.search);
    var requested = (params.get('lang') || '').toLowerCase();
    var browserLang = (navigator.language || 'en').slice(0, 2).toLowerCase();
    var lang = SUPPORTED.indexOf(requested) !== -1
      ? requested
      : (SUPPORTED.indexOf(browserLang) !== -1 ? browserLang : 'en');

    function applyLang(l) {
      lang = l;
      var c = COPY[l] || COPY.en;
      document.documentElement.lang = l;
      document.documentElement.dir = (l === 'ar') ? 'rtl' : 'ltr';
      document.title = c.pageTitle;
      document.getElementById('title').textContent = c.title;
      document.getElementById('subtitle').textContent = c.subtitle;
      document.getElementById('label-pwd').textContent = c.labelPwd;
      document.getElementById('label-pwd2').textContent = c.labelPwd2;
      document.getElementById('submit-btn').textContent = busy ? c.submitting : (checking ? c.checking : c.submit);
      if (errorKey) showError(errorKey);
      document.getElementById('success-title').textContent = c.successTitle;
      document.getElementById('success-msg').textContent = c.successMsg;
      document.getElementById('open-app-btn').textContent = c.openApp;
      document.getElementById('link-privacy').textContent = c.linkPrivacy;
      document.getElementById('link-terms').textContent = c.linkTerms;
      document.getElementById('link-contact').textContent = c.linkContact;
      // Toggle active button
      var btns = document.querySelectorAll('.lang-btn');
      for (var i = 0; i < btns.length; i++) {
        btns[i].classList.toggle('active', btns[i].getAttribute('data-lang') === l);
      }
    }

    // Wire lang buttons
    document.getElementById('lang-toggle').addEventListener('click', function (e) {
      var t = e.target;
      if (t && t.classList && t.classList.contains('lang-btn')) {
        applyLang(t.getAttribute('data-lang'));

    });

    var fragment = window.__scoremindRecovery || new URLSearchParams();
    var incompatibleCode = window.__scoremindRecoveryCode;
    delete window.__scoremindRecovery;
    delete window.__scoremindRecoveryCode;
    var tokens = { access_token: fragment.get('access_token'), refresh_token: fragment.get('refresh_token') };
    var hasRecoveryToken = tokens.access_token && tokens.refresh_token && fragment.get('type') === 'recovery';
    fragment = null;
    var msgEl = document.getElementById('msg');
    var btn = document.getElementById('submit-btn');
    var ready = false;
    function showError(key) {
      errorKey = key;
      msgEl.textContent = (COPY[lang] || COPY.en)[key] || COPY[lang].errGeneric;
      msgEl.className = 'msg error';
    }
    function clearMsg() { errorKey = null; msgEl.textContent = ''; msgEl.className = 'msg'; }
    function bounded(operation) {
      return new Promise(function (resolve, reject) {
        var timer = setTimeout(function () { reject({ code: 'network_timeout' }); }, 15000);
        Promise.resolve(operation).then(function (value) { clearTimeout(timer); resolve(value); }, function (error) { clearTimeout(timer); reject(error); });

    prepareRecovery();

      if (busy || !ready || !sb) return;
      clearMsg();
      var input1 = document.getElementById('pwd1');
      var input2 = document.getElementById('pwd2');
      var password = input1.value;
      if (password.length < 8) { showError('errTooShort'); return; }
      if (password !== input2.value) { showError('errMismatch'); return; }
      if (password.length > 4096) { showError('errGeneric'); return; }
      busy = true; btn.disabled = true; applyLang(lang);
      try {
